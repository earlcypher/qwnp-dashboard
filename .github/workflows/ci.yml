name: Dashboard CI
on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: Dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Repository hygiene
        run: node scripts/check-repository-hygiene.mjs
      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Isolated tests
        run: npm test
      - name: Type-check
        run: npm run typecheck
      - name: Build with safe fixture staging configuration
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          VERCEL_ENV: preview
          NEXT_PUBLIC_APP_ENV: staging
          NEXT_PUBLIC_API_URL: https://staging-fixture.invalid
          NEXT_PUBLIC_EXPECTED_API_ORIGIN: https://staging-fixture.invalid
        run: npm run build
